# Dev profile — uses H2 in-memory database (no PostgreSQL needed)
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

 # Dev safety net: create/update tables if Flyway did not initialize this in-memory DB instance
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway still runs the migration SQL, but H2 needs a couple of tweaks
#spring.flyway.enabled=true

# Disable Postgres-only security for dev
spring.security.user.name=admin
spring.security.user.password=admin

app.festival-year=2026
