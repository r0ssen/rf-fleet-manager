# ── Default profile (production) — PostgreSQL ────────────────────────────
# To run locally without PostgreSQL, use: mvn spring-boot:run -Dspring-boot.run.profiles=dev
spring.datasource.url=jdbc:postgresql://localhost:5432/transport
spring.datasource.username=transport
spring.datasource.password=changeme
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.thymeleaf.cache=false
app.festival-year=2025
