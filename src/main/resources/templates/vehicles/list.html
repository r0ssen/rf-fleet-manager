<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="da">
<head th:replace="~{fragments/layout :: head('Biler')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
    <div class="toolbar">
        <h1>Biler</h1>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/vehicles/new}" class="btn-primary">+ Tilføj bil</a>
    </div>
    <div class="table-wrap">
    <table>
        <thead>
            <tr>
                <th>Bil nr.</th><th>Nummerplade</th><th>Model</th><th>Lastevægt (kg)</th>
                <th>Udvendige mål (L×B×H m)</th><th>Indvendige mål (L×B×H m)</th>
                <th>Udstyr</th><th>Handlinger</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="v : ${vehicles}">
                <td th:text="${v.vehicleNo}"></td>
                <td th:text="${v.registration}"></td>
                <td th:text="${v.model}"></td>
                <td th:text="${v.payloadKg}"></td>
                <td th:text="${v.vehicleLengthMm != null ? #numbers.formatDecimal(v.vehicleLengthMm.doubleValue()/1000,1,2) + ' × ' + #numbers.formatDecimal(v.vehicleWidthMm.doubleValue()/1000,1,2) + ' × ' + #numbers.formatDecimal(v.vehicleHeightMm.doubleValue()/1000,1,2) : ''}"></td>
                <td th:text="${v.cargoLengthMm  != null ? #numbers.formatDecimal(v.cargoLengthMm.doubleValue()/1000,1,2)  + ' × ' + #numbers.formatDecimal(v.cargoWidthMm.doubleValue()/1000,1,2)  + ' × ' + #numbers.formatDecimal(v.cargoHeightMm.doubleValue()/1000,1,2)  : ''}"></td>
                <td>
                    <span th:if="${v.hasPalletLifter}" class="tag">Palleløfter</span>
                    <span th:if="${v.hasSackTruck}"    class="tag">Sækkevogn</span>
                </td>
                <td>
                    <a sec:authorize="hasRole('ADMIN')" th:href="@{/vehicles/{id}/edit(id=${v.vehicleId})}" class="btn-small">Rediger</a>
                    <a sec:authorize="!hasRole('ADMIN')" th:href="@{/vehicles/{id}/edit(id=${v.vehicleId})}" class="btn-small">Se detaljer</a>
                    <form sec:authorize="hasRole('ADMIN')"
                          th:action="@{/vehicles/{id}/delete(id=${v.vehicleId})}" method="post"
                          style="display:inline" onsubmit="return confirm('Slet denne bil?')">
                        <button type="submit" class="btn-small btn-danger">Slet</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(vehicles)}"><td colspan="8" class="empty">Ingen biler registreret.</td></tr>
        </tbody>
    </table>
    </div>
</main>
</body>
</html>
