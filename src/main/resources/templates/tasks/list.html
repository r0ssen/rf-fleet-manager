<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="da">
<head th:replace="~{fragments/layout :: head('Kørsler')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
    <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

    <div class="toolbar">
        <h1 th:text="${isDriver} ? 'Mine kørsler' : 'Kørselsadministration'">Kørsler</h1>

        <!-- Date navigation: hidden for DRIVER (always today) -->
        <div class="date-nav" th:if="${!isDriver}">
            <a th:href="@{/tasks(date=${prevDay},showCancelled=${showCancelled},showDone=${showDone})}" class="btn-secondary">&#8249;</a>
            <input type="text" id="taskDatePicker"
                   th:value="${#temporals.format(date, 'dd/MM/yyyy')}"
                   placeholder="dd/mm/yyyy" maxlength="10" size="10"
                   onchange="goTaskDateDanish(this.value)"/>
            <a th:href="@{/tasks(date=${nextDay},showCancelled=${showCancelled},showDone=${showDone})}" class="btn-secondary">&#8250;</a>
            <span class="date-label"
                  th:text="${#temporals.format(date, 'EEEE d. MMMM yyyy', danishLocale)}"></span>
        </div>
        <span class="date-label" th:if="${isDriver}"
              th:text="${#temporals.format(date, 'EEEE d. MMMM yyyy', danishLocale)}"></span>

        <a th:if="${!isDriver}" th:href="@{/tasks/new(date=${date},returnTo='tasks')}" class="btn-primary">+ Opret kørsel</a>

        <!-- DRIVER toggles: show STARTED by default; opt-in to ORDERED and DONE -->
        <label th:if="${isDriver}" style="display:inline-flex;flex-direction:row;align-items:center;gap:0.35rem;margin-left:0.25rem;margin-bottom:0;white-space:nowrap;font-size:12px;color:#4b5563;">
            <input type="checkbox" id="showOrderedToggle" th:checked="${showOrdered}" onchange="goDriverFilter()"/>
            <span>Vis bestilte</span>
        </label>
        <label th:if="${isDriver}" style="display:inline-flex;flex-direction:row;align-items:center;gap:0.35rem;margin-left:0.25rem;margin-bottom:0;white-space:nowrap;font-size:12px;color:#4b5563;">
            <input type="checkbox" id="showDoneToggle" th:checked="${showDone}" onchange="goDriverFilter()"/>
            <span>Vis udførte</span>
        </label>

        <!-- Standard ADMIN/AGENT toggles -->
        <label th:if="${!isDriver}" style="display:inline-flex;flex-direction:row;align-items:center;gap:0.35rem;margin-left:0.25rem;margin-bottom:0;white-space:nowrap;font-size:12px;color:#4b5563;">
            <input type="checkbox" id="showDoneToggle" th:checked="${showDone}" onchange="goTaskDateDanish(document.getElementById('taskDatePicker').value)"/>
            <span>Vis udførte</span>
        </label>
        <label th:if="${!isDriver}" style="display:inline-flex;flex-direction:row;align-items:center;gap:0.35rem;margin-left:0.25rem;margin-bottom:0;white-space:nowrap;font-size:12px;color:#4b5563;">
            <input type="checkbox" id="showCancelledToggle" th:checked="${showCancelled}" onchange="goTaskDateDanish(document.getElementById('taskDatePicker').value)"/>
            <span>Vis slettede</span>
        </label>
    </div>

    <div class="table-wrap">
    <table class="task-table">
        <thead>
            <tr>
                <th>Tidspunkt</th>
                <th>Bestiller</th>
                <th>Steder</th>
                <th>Afdeling</th>
                <th>Bil</th>
                <th>Chauffør</th>
                <th th:if="${!isDriver}">Dispatcher</th>
                <th>Beskrivelse</th>
                <th>Status</th>
                <th>Handlinger</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="t : ${tasks}" th:classappend="'row-' + ${t.status.name().toLowerCase()} + (${t.vehicleId == null} ? ' row-no-vehicle' : '')">
                <td class="col-time" data-label="Tid">
                    <span th:text="${#temporals.format(t.startTs, 'HH:mm')}"></span>
                    <span th:if="${t.endTs != null}"> – <span th:text="${#temporals.format(t.endTs, 'HH:mm')}"></span></span>
                    <span th:if="${t.status.name() == 'ORDERED' and t.startTs.isBefore(now)}"
                          class="overdue-badge" title="Kørslen er ikke startet og tidspunktet er overskredet">!</span>
                </td>
                <td class="col-booker" data-label="Bestiller">
                    <strong th:text="${t.bookerName}"></strong>
                    <span th:if="${t.bookerPhone != null}" class="phone" th:text="${'📞 ' + t.bookerPhone}"></span>
                    <span th:if="${t.contactName != null}" class="contact" th:text="${'Kontakt: ' + t.contactName}"></span>
                </td>
                <td class="col-route" data-label="Steder">
                    <span th:text="${t.startPoint}"></span>
                    <span th:if="${t.viaPoint != null and !#strings.isEmpty(t.viaPoint)}" class="via"> via <em th:text="${#strings.replace(t.viaPoint, '|', ' → ')}"></em></span>
                    <span class="arrow"> → </span>
                    <span th:text="${t.endPoint}"></span>
                    <a th:if="${t.directionsUrl() != null}" th:href="${t.directionsUrl()}" target="_blank" class="map-link" title="Hent rutevejledning">🗺</a>
                </td>
                <td class="col-affiliation" data-label="Afdeling">
                    <span th:text="${t.division}"></span>
                    <span th:if="${t.team != null}" class="team">/ <span th:text="${t.team}"></span></span>
                </td>
                <td class="col-vehicle" data-label="Bil">
                    <span th:if="${t.vehicle != null}" th:text="${'Bil ' + t.vehicle.vehicleNo + (t.vehicle.model != null ? ' – ' + t.vehicle.model : '')}"></span>
                    <span th:if="${t.vehicleId == null}" class="vehicle-missing-badge">Ikke tildelt bil</span>
                </td>
                <td class="col-driver" data-label="Chauffør">
                    <span th:if="${t.driverName != null and !#strings.isEmpty(#strings.trim(t.driverName))}" th:text="${t.driverName}"></span>
                    <span th:if="${(t.driverName == null or #strings.isEmpty(#strings.trim(t.driverName))) and t.status.name() != 'CANCELLED'}" class="driver-missing-badge">Ingen chauffør</span>
                </td>
                <td th:if="${!isDriver}" class="col-dispatcher" data-label="Dispatcher">
                    <span th:if="${t.receivedBy != null and !#strings.isEmpty(#strings.trim(t.receivedBy))}" th:text="${t.receivedBy}"></span>
                    <span th:if="${(t.receivedBy == null or #strings.isEmpty(#strings.trim(t.receivedBy))) and t.status.name() != 'CANCELLED'}" class="driver-missing-badge">Ingen dispatcher</span>
                </td>
                <td class="col-desc" data-label="Beskrivelse"><span class="desc-text" th:text="${t.description}"></span></td>
                <td class="col-status" data-label="Status">
                    <div><strong th:text="${t.status.danishLabel()}">Bestilt</strong></div>
                    <div th:if="${!isDriver and t.status.name() == 'ORDERED' and (t.vehicleId == null or #strings.isEmpty(t.driverName))}"
                         class="status-note" style="margin-top:4px;">
                        Kan ikke startes uden bil og chauffør.
                    </div>
                    <form th:if="${!isDriver and t.vehicleId != null and not #strings.isEmpty(t.driverName) and t.status.name() == 'ORDERED'}"
                          th:action="@{/tasks/{id}/status(id=${t.taskId})}" method="post" style="margin-top:4px;">
                        <input type="hidden" name="date" th:value="${#temporals.format(date,'yyyy-MM-dd')}"/>
                        <input type="hidden" name="returnTo" value="tasks"/>
                        <input type="hidden" name="showCancelled" th:value="${showCancelled}"/>
                        <input type="hidden" name="showDone" th:value="${showDone}"/>
                        <button type="submit" class="btn-small" name="status" value="STARTED">Start</button>
                    </form>
                    <form th:if="${!isDriver and t.vehicleId != null and t.status.name() == 'STARTED'}"
                          th:action="@{/tasks/{id}/status(id=${t.taskId})}" method="post" style="margin-top:4px; display:flex; gap:6px;">
                        <input type="hidden" name="date" th:value="${#temporals.format(date,'yyyy-MM-dd')}"/>
                        <input type="hidden" name="returnTo" value="tasks"/>
                        <input type="hidden" name="showCancelled" th:value="${showCancelled}"/>
                        <input type="hidden" name="showDone" th:value="${showDone}"/>
                        <button type="submit" class="btn-small" name="status" value="ORDERED">Til Bestilt</button>
                        <button type="submit" class="btn-small" name="status" value="DONE">Udført</button>
                    </form>
                    <form th:if="${!isDriver and t.vehicleId != null and t.status.name() == 'DONE'}"
                          th:action="@{/tasks/{id}/status(id=${t.taskId})}" method="post" style="margin-top:4px;">
                        <input type="hidden" name="date" th:value="${#temporals.format(date,'yyyy-MM-dd')}"/>
                        <input type="hidden" name="returnTo" value="tasks"/>
                        <input type="hidden" name="showCancelled" th:value="${showCancelled}"/>
                        <input type="hidden" name="showDone" th:value="${showDone}"/>
                        <button type="submit" class="btn-small" name="status" value="ORDERED">Til Bestilt</button>
                    </form>
                </td>
                <td class="col-actions" data-label="">
                    <!-- DRIVER: read-only detail link only -->
                    <a th:if="${isDriver}" th:href="@{/tasks/{id}/edit(id=${t.taskId},returnTo='tasks')}" class="btn-small">Se detaljer</a>
                    <!-- ADMIN/AGENT: full action set -->
                    <a th:if="${!isDriver}" th:href="@{/tasks/{id}/edit(id=${t.taskId},returnTo='tasks')}" class="btn-small">Rediger</a>
                    <form th:if="${!isDriver}" th:action="@{/tasks/{id}/duplicate(id=${t.taskId})}" method="post" style="display:inline"
                          onsubmit="return confirm('Kopier denne kørsel?')">
                        <input type="hidden" name="date" th:value="${#temporals.format(date,'yyyy-MM-dd')}"/>
                        <input type="hidden" name="showCancelled" th:value="${showCancelled}"/>
                        <input type="hidden" name="showDone" th:value="${showDone}"/>
                        <button type="submit" class="btn-small btn-secondary">Kopiér</button>
                    </form>
                    <form th:if="${!isDriver and t.status.name() != 'CANCELLED'}"
                          th:action="@{/tasks/{id}/delete(id=${t.taskId})}" method="post" style="display:inline"
                          onsubmit="return confirm('Slet denne kørsel?')">
                        <input type="hidden" name="date" th:value="${#temporals.format(date,'yyyy-MM-dd')}"/>
                        <input type="hidden" name="returnTo" value="tasks"/>
                        <input type="hidden" name="showCancelled" th:value="${showCancelled}"/>
                        <input type="hidden" name="showDone" th:value="${showDone}"/>
                        <button type="submit" class="btn-small btn-danger">Slet</button>
                    </form>
                    <form th:if="${!isDriver and t.status.name() == 'CANCELLED'}"
                          th:action="@{/tasks/{id}/delete(id=${t.taskId})}" method="post" style="display:inline"
                          onsubmit="return confirm('Genåbn denne kørsel?')">
                        <input type="hidden" name="date" th:value="${#temporals.format(date,'yyyy-MM-dd')}"/>
                        <input type="hidden" name="returnTo" value="tasks"/>
                        <input type="hidden" name="showCancelled" th:value="${showCancelled}"/>
                        <input type="hidden" name="showDone" th:value="${showDone}"/>
                        <button type="submit" class="btn-small btn-secondary">Genåbn</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(tasks)}">
                <td th:colspan="${isDriver ? 9 : 10}" class="empty">Ingen kørsler registreret for denne dag.</td>
            </tr>
        </tbody>
    </table>
    </div>

    <div class="summary-bar" th:if="${not #lists.isEmpty(tasks)}">
        <span th:text="${#lists.size(tasks)} + ' kørsel(er) i alt'"></span>
        <span class="dot ordered"></span>
        <span th:text="${#lists.size(tasks.?[status.name() == 'ORDERED'])} + ' bestilt'"></span>
        <span class="dot started"></span>
        <span th:text="${#lists.size(tasks.?[status.name() == 'STARTED'])} + ' startet'"></span>
        <span class="dot done"></span>
        <span th:text="${#lists.size(tasks.?[status.name() == 'DONE'])} + ' udført'"></span>
    </div>
</main>
<script>
function goTaskDate(isoDate) {
    var params = new URLSearchParams();
    if (isoDate) params.set('date', isoDate);
    var showCancelled = document.getElementById('showCancelledToggle');
    if (showCancelled && showCancelled.checked) params.set('showCancelled', 'true');
    var showDone = document.getElementById('showDoneToggle');
    if (showDone && showDone.checked) params.set('showDone', 'true');
    window.location = '/tasks' + (params.toString() ? ('?' + params.toString()) : '');
}
function goTaskDateDanish(value) {
    var m = value.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    if (m) goTaskDate(m[3] + '-' + m[2] + '-' + m[1]);
}
function goDriverFilter() {
    var params = new URLSearchParams();
    var showOrdered = document.getElementById('showOrderedToggle');
    if (showOrdered && showOrdered.checked) params.set('showOrdered', 'true');
    var showDone = document.getElementById('showDoneToggle');
    if (showDone && showDone.checked) params.set('showDone', 'true');
    window.location = '/tasks' + (params.toString() ? ('?' + params.toString()) : '');
}
document.addEventListener('DOMContentLoaded', function() {
    var picker = document.getElementById('taskDatePicker');
    if (picker) flatpickr(picker, { locale: 'da', dateFormat: 'd/m/Y', allowInput: true });
});
</script>
</body>
</html>
