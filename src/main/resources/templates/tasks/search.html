<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="da">
<head th:replace="~{fragments/layout :: head('Søg kørsler')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
    <div class="toolbar">
        <h1>Søg kørsler</h1>
        <form th:action="@{/tasks/search}" method="get" style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;">
            <input type="search" name="q" th:value="${q}" placeholder="Bestiller, kontakt eller telefon…"
                   autocomplete="off" style="min-width:260px;"/>
            <button type="submit" class="btn-primary">Søg</button>
            <label style="display:inline-flex;flex-direction:row;align-items:center;gap:0.35rem;margin-bottom:0;white-space:nowrap;font-size:12px;color:#4b5563;">
                <input type="checkbox" name="showCancelled" value="true" th:checked="${showCancelled}" onchange="this.form.submit()"/>
                <span>Vis slettede</span>
            </label>
        </form>
    </div>

    <div th:if="${q != null and !#strings.isEmpty(q)}" style="margin-bottom:0.75rem;color:#6b7280;font-size:0.875rem;">
        <span th:if="${#lists.isEmpty(tasks)}">Ingen resultater for <strong th:text="${q}"></strong>.</span>
        <span th:if="${!#lists.isEmpty(tasks)}"
              th:text="${#lists.size(tasks)} + ' resultat(er) for \'' + ${q} + '\''"></span>
    </div>

    <div class="table-wrap" th:if="${!#lists.isEmpty(tasks)}">
    <table class="task-table search-table">
        <thead>
            <tr>
                <th>Dato</th>
                <th>Tidspunkt</th>
                <th>Bestiller</th>
                <th>Kontakt</th>
                <th>Steder</th>
                <th>Bil</th>
                <th>Chauffør</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody th:if="${!#lists.isEmpty(futureTasks)}">
            <tr class="search-section-header"><td colspan="8">Kommende</td></tr>
            <tr th:each="t : ${futureTasks}"
                th:classappend="'row-' + ${t.status.name().toLowerCase()} + (${t.vehicleId == null} ? ' row-no-vehicle' : '')"
                th:attr="data-href=@{/tasks/{id}/edit(id=${t.taskId},returnTo='search',searchQuery=${q})}">
                <td data-label="Dato" style="white-space:nowrap;width:1px;">
                    <span th:text="${#temporals.format(t.startTs, 'EEE d. MMM yyyy', danishLocale)}"></span>
                    <a th:href="@{/fleet(date=${#temporals.format(t.startTs,'yyyy-MM-dd')})}" class="fleet-date-link" title="Vis i flådeoversigt">Flåde ↗</a>
                </td>
                <td class="col-time" data-label="Tid"><span th:text="${#temporals.format(t.startTs, 'HH:mm')}"></span><span th:if="${t.endTs != null}"> – <span th:text="${#temporals.format(t.endTs, 'HH:mm')}"></span></span></td>
                <td class="col-booker" data-label="Bestiller"><strong th:text="${t.bookerName}"></strong><a th:if="${t.bookerPhone != null}" class="phone" th:href="'tel:' + ${t.bookerPhone}" th:text="${'📞 ' + t.bookerPhone}"></a></td>
                <td data-label="Kontakt" style="white-space:nowrap;overflow:hidden;max-width:0;"><span th:if="${t.contactName != null and !#strings.isEmpty(t.contactName)}" th:text="${t.contactName}"></span><a th:if="${t.contactPhone != null and !#strings.isEmpty(t.contactPhone)}" class="phone" th:href="'tel:' + ${t.contactPhone}" th:text="${'📞 ' + t.contactPhone}"></a></td>
                <td class="col-route" data-label="Steder"><span th:text="${t.startPoint}"></span><span th:if="${t.viaPoint != null and !#strings.isEmpty(t.viaPoint)}" class="via"> via <em th:text="${#strings.replace(t.viaPoint, '|', ' → ')}"></em></span><span class="arrow"> → </span><span th:text="${t.endPoint}"></span></td>
                <td class="col-vehicle" data-label="Bil"><span th:if="${t.vehicle != null}" th:text="${'Bil ' + t.vehicle.vehicleNo + (t.vehicle.model != null ? ' – ' + t.vehicle.model : '')}"></span><span th:if="${t.vehicleId == null}" class="vehicle-missing-badge">Ikke tildelt bil</span></td>
                <td class="col-driver" data-label="Chauffør"><span th:if="${t.driverUser != null}" th:text="${t.driverUser.username}"></span><span th:if="${t.driverUser == null and t.driverName != null and !#strings.isEmpty(#strings.trim(t.driverName))}" th:text="${t.driverName}"></span></td>
                <td class="col-status" data-label="Status"><strong th:text="${t.status.danishLabel()}"></strong></td>
            </tr>
        </tbody>

        <tbody th:if="${!#lists.isEmpty(todayTasks)}">
            <tr class="search-section-header"><td colspan="8">I dag</td></tr>
            <tr th:each="t : ${todayTasks}"
                th:classappend="'row-' + ${t.status.name().toLowerCase()} + (${t.vehicleId == null} ? ' row-no-vehicle' : '')"
                th:attr="data-href=@{/tasks/{id}/edit(id=${t.taskId},returnTo='search',searchQuery=${q})}">
                <td data-label="Dato" style="white-space:nowrap;width:1px;">
                    <span th:text="${#temporals.format(t.startTs, 'EEE d. MMM yyyy', danishLocale)}"></span>
                    <a th:href="@{/fleet(date=${#temporals.format(t.startTs,'yyyy-MM-dd')})}" class="fleet-date-link" title="Vis i flådeoversigt">Flåde ↗</a>
                </td>
                <td class="col-time" data-label="Tid"><span th:text="${#temporals.format(t.startTs, 'HH:mm')}"></span><span th:if="${t.endTs != null}"> – <span th:text="${#temporals.format(t.endTs, 'HH:mm')}"></span></span></td>
                <td class="col-booker" data-label="Bestiller"><strong th:text="${t.bookerName}"></strong><a th:if="${t.bookerPhone != null}" class="phone" th:href="'tel:' + ${t.bookerPhone}" th:text="${'📞 ' + t.bookerPhone}"></a></td>
                <td data-label="Kontakt" style="white-space:nowrap;overflow:hidden;max-width:0;"><span th:if="${t.contactName != null and !#strings.isEmpty(t.contactName)}" th:text="${t.contactName}"></span><a th:if="${t.contactPhone != null and !#strings.isEmpty(t.contactPhone)}" class="phone" th:href="'tel:' + ${t.contactPhone}" th:text="${'📞 ' + t.contactPhone}"></a></td>
                <td class="col-route" data-label="Steder"><span th:text="${t.startPoint}"></span><span th:if="${t.viaPoint != null and !#strings.isEmpty(t.viaPoint)}" class="via"> via <em th:text="${#strings.replace(t.viaPoint, '|', ' → ')}"></em></span><span class="arrow"> → </span><span th:text="${t.endPoint}"></span></td>
                <td class="col-vehicle" data-label="Bil"><span th:if="${t.vehicle != null}" th:text="${'Bil ' + t.vehicle.vehicleNo + (t.vehicle.model != null ? ' – ' + t.vehicle.model : '')}"></span><span th:if="${t.vehicleId == null}" class="vehicle-missing-badge">Ikke tildelt bil</span></td>
                <td class="col-driver" data-label="Chauffør"><span th:if="${t.driverUser != null}" th:text="${t.driverUser.username}"></span><span th:if="${t.driverUser == null and t.driverName != null and !#strings.isEmpty(#strings.trim(t.driverName))}" th:text="${t.driverName}"></span></td>
                <td class="col-status" data-label="Status"><strong th:text="${t.status.danishLabel()}"></strong></td>
            </tr>
        </tbody>

        <tbody th:if="${!#lists.isEmpty(pastTasks)}">
            <tr class="search-section-header"><td colspan="8">Tidligere</td></tr>
            <tr th:each="t : ${pastTasks}"
                th:classappend="'row-' + ${t.status.name().toLowerCase()} + (${t.vehicleId == null} ? ' row-no-vehicle' : '')"
                th:attr="data-href=@{/tasks/{id}/edit(id=${t.taskId},returnTo='search',searchQuery=${q})}">
                <td data-label="Dato" style="white-space:nowrap;width:1px;">
                    <span th:text="${#temporals.format(t.startTs, 'EEE d. MMM yyyy', danishLocale)}"></span>
                    <a th:href="@{/fleet(date=${#temporals.format(t.startTs,'yyyy-MM-dd')})}" class="fleet-date-link" title="Vis i flådeoversigt">Flåde ↗</a>
                </td>
                <td class="col-time" data-label="Tid"><span th:text="${#temporals.format(t.startTs, 'HH:mm')}"></span><span th:if="${t.endTs != null}"> – <span th:text="${#temporals.format(t.endTs, 'HH:mm')}"></span></span></td>
                <td class="col-booker" data-label="Bestiller"><strong th:text="${t.bookerName}"></strong><a th:if="${t.bookerPhone != null}" class="phone" th:href="'tel:' + ${t.bookerPhone}" th:text="${'📞 ' + t.bookerPhone}"></a></td>
                <td data-label="Kontakt" style="white-space:nowrap;overflow:hidden;max-width:0;"><span th:if="${t.contactName != null and !#strings.isEmpty(t.contactName)}" th:text="${t.contactName}"></span><a th:if="${t.contactPhone != null and !#strings.isEmpty(t.contactPhone)}" class="phone" th:href="'tel:' + ${t.contactPhone}" th:text="${'📞 ' + t.contactPhone}"></a></td>
                <td class="col-route" data-label="Steder"><span th:text="${t.startPoint}"></span><span th:if="${t.viaPoint != null and !#strings.isEmpty(t.viaPoint)}" class="via"> via <em th:text="${#strings.replace(t.viaPoint, '|', ' → ')}"></em></span><span class="arrow"> → </span><span th:text="${t.endPoint}"></span></td>
                <td class="col-vehicle" data-label="Bil"><span th:if="${t.vehicle != null}" th:text="${'Bil ' + t.vehicle.vehicleNo + (t.vehicle.model != null ? ' – ' + t.vehicle.model : '')}"></span><span th:if="${t.vehicleId == null}" class="vehicle-missing-badge">Ikke tildelt bil</span></td>
                <td class="col-driver" data-label="Chauffør"><span th:if="${t.driverUser != null}" th:text="${t.driverUser.username}"></span><span th:if="${t.driverUser == null and t.driverName != null and !#strings.isEmpty(#strings.trim(t.driverName))}" th:text="${t.driverName}"></span></td>
                <td class="col-status" data-label="Status"><strong th:text="${t.status.danishLabel()}"></strong></td>
            </tr>
        </tbody>
    </table>
    </div>
</main>
<style>
.search-table .col-vehicle,
.search-table .col-driver { max-width: none; overflow: visible; }
.search-table .col-status { width: auto; white-space: nowrap; }
.search-table .col-route { width: 35%; }
.fleet-date-link {
    display: inline-block; margin-left: 0.4rem;
    font-size: 11px; color: #6b7280; text-decoration: none;
    opacity: 0; transition: opacity 0.15s;
}
tr:hover .fleet-date-link { opacity: 1; }
.fleet-date-link:hover { color: #2563eb; text-decoration: underline; }
.search-section-header td {
    background: #f3f4f6; color: #6b7280;
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
    padding: 0.4rem 0.75rem; border-top: 2px solid #e5e7eb;
}
.search-section-header:first-child td { border-top: none; }
</style>
<script>
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.task-table tr[data-href]').forEach(function(row) {
        row.addEventListener('click', function(e) {
            if (e.target.closest('button, a, input, select, form, label')) return;
            window.location = row.dataset.href;
        });
    });
});
</script>
</body>
</html>
