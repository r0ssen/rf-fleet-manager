<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="da">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} + ' — Fleet Manager'">Fleet Manager</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/da.js"></script>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<nav th:fragment="nav">
    <div class="nav-brand">🚚 Fleet Manager</div>
    <div class="nav-links">
        <a th:href="@{/tasks}">Kørsler</a>
        <a sec:authorize="hasAnyRole('ADMIN','AGENT')" th:href="@{/fleet}">Flådeoversigt</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/vehicles}">Biler</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/opening-hours}">Åbningstider</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/users}">Brugere</a>
    </div>
    <div class="nav-logout">
        <span class="nav-user" sec:authentication="name"></span>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <button type="submit" class="btn-logout">Log ud</button>
        </form>
    </div>
</nav>
</body>
</html>
