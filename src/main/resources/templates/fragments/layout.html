<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="da">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} + ' — Fleet Manager'">Fleet Manager</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/da.js"></script>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        function danishToIso(val) {
            var m = val && val.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
            return m ? m[3] + '-' + m[2] + '-' + m[1] : null;
        }
        var picker = document.getElementById('fleetDatePicker') || document.getElementById('taskDatePicker');
        if (picker) {
            var iso = danishToIso(picker.value);
            if (iso) sessionStorage.setItem('navDate', iso);
        }
        var navDate = sessionStorage.getItem('navDate');
        if (navDate) {
            [document.querySelector('a[href="/tasks"]'), document.querySelector('a[href="/fleet"]')]
                .forEach(function(el) { if (el) el.href = el.getAttribute('href') + '?date=' + navDate; });
        }
    });
    </script>
</head>
<body>
<nav th:fragment="nav">
    <div class="nav-brand">🚚 Fleet Manager</div>
    <div class="nav-links">
        <a th:href="@{/tasks}">Kørsler</a>
        <a sec:authorize="hasAnyRole('ADMIN','AGENT')" th:href="@{/fleet}">Flådeoversigt</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/vehicles}">Biler</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/opening-hours}">Åbningstider</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/users}">Brugere</a>
    </div>
    <form class="nav-search" sec:authorize="hasAnyRole('ADMIN','AGENT')" th:action="@{/tasks/search}" method="get" role="search">
        <input type="search" name="q" placeholder="Søg bestiller / kontakt…" autocomplete="off"/>
        <button type="submit">Søg</button>
    </form>
    <div class="nav-logout">
        <span class="nav-user" sec:authentication="name"></span>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <button type="submit" class="btn-logout">Log ud</button>
        </form>
    </div>
</nav>
</body>
</html>
