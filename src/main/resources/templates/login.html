<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="da">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Log ind — Fleet Manager</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="login-page">
<main class="login-box">
    <h1>🚚 Fleet Manager</h1>
    <h2>Kørselsadministration</h2>
    <div th:if="${param.error}" class="alert alert-error">Forkert brugernavn eller adgangskode.</div>
    <div th:if="${param.logout}" class="alert alert-info">Du er nu logget ud.</div>
    <form th:action="@{/login}" method="post">
        <label>Brugernavn<input type="text" name="username" autofocus/></label>
        <label>Adgangskode<input type="password" name="password"/></label>
        <button type="submit" class="btn-primary btn-full">Log ind</button>
    </form>
</main>
</body>
</html>
