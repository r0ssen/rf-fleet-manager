<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="da">
<head th:replace="~{fragments/layout :: head('Åbningstider')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main>
    <div class="toolbar">
        <h1>Åbningstider <span th:text="${year}"></span></h1>
        <a th:href="@{/fleet}" class="btn-secondary">← Flådeoversigt</a>
    </div>

    <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

    <div class="two-col">

        <!-- ── Existing rows ──────────────────────────────────────────── -->
        <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Dato</th>
                    <th>Åbner</th>
                    <th>Lukker</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="h : ${hoursList}">
                    <td th:text="${#temporals.format(h.festivalDate, 'EEEE d. MMM', new java.util.Locale('da'))}"></td>
                    <td th:text="${#temporals.format(h.openFrom,  'HH:mm')}"></td>
                    <td th:text="${#temporals.format(h.openUntil, 'HH:mm')}"></td>
                    <td>
                        <form th:action="@{/opening-hours/delete}" method="post" style="display:inline"
                              onsubmit="return confirm('Slet åbningstider for denne dag?')">
                            <input type="hidden" name="festivalDate" th:value="${h.festivalDate}"/>
                            <button type="submit" class="btn-small btn-danger">Slet</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(hoursList)}">
                    <td colspan="4" class="empty">Ingen åbningstider registreret.</td>
                </tr>
            </tbody>
        </table>
        </div>

        <!-- ── Add / update a day ─────────────────────────────────────── -->
        <div>
            <h2>Tilføj / opdater dag</h2>
            <form th:action="@{/opening-hours/save}" method="post" id="openingHoursForm">
                <fieldset>
                    <legend>Dag</legend>
                    <div id="timeError" class="form-error" style="display:none; margin-bottom: 1rem;">
                        <strong>Fejl:</strong> Lukketid skal være efter åbningstid.
                    </div>
                    <div id="duplicateError" class="form-error" style="display:none; margin-bottom: 1rem;">
                        <strong>Fejl:</strong> Der er allerede registreret åbningstider for denne dato. Slet den eksisterende post først.
                    </div>
                    <label>Dato
                        <input type="text" id="festivalDateDisplay" placeholder="dd/mm/yyyy"
                               maxlength="10" required autocomplete="off"
                               oninput="syncFestivalDate(this.value)"/>
                        <input type="hidden" name="festivalDate" id="festivalDate"/>
                    </label>
                    <label>Åbner
                        <select name="openFrom" id="openFrom" required></select>
                    </label>
                    <label>Lukker
                        <select name="openUntil" id="openUntil" required></select>
                    </label>
                </fieldset>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Gem</button>
                </div>
            </form>
        </div>

    </div>
</main>
<style>
.two-col { display: grid; grid-template-columns: 1fr 380px; gap: 1.5rem; align-items: start; }
</style>
<script th:inline="javascript">
/*<![CDATA[*/
(function() {
    // Dates that already have opening hours (from server)
    const existingDates = new Set(/*[[${hoursList.![festivalDate.toString()]}]]*/ []);

    function buildHourOptions(selectEl, defaultValue) {
        for (var h = 0; h <= 23; h++) {
            var val = (h < 10 ? '0' : '') + h + ':00';
            var opt = document.createElement('option');
            opt.value = val;
            opt.textContent = val;
            if (val === defaultValue) opt.selected = true;
            selectEl.appendChild(opt);
        }
    }
    buildHourOptions(document.getElementById('openFrom'),  '08:00');
    buildHourOptions(document.getElementById('openUntil'), '22:00');

    const form = document.getElementById('openingHoursForm');
    const openFromSelect = document.getElementById('openFrom');
    const openUntilSelect = document.getElementById('openUntil');
    const festivalDateInput = document.getElementById('festivalDate');
    const festivalDateDisplay = document.getElementById('festivalDateDisplay');
    const timeError = document.getElementById('timeError');
    const duplicateError = document.getElementById('duplicateError');

    function syncFestivalDate(value) {
        var m = value.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
        festivalDateInput.value = m ? m[3] + '-' + m[2] + '-' + m[1] : '';
        validateDuplicate();
    }
    window.syncFestivalDate = syncFestivalDate;

    festivalDateDisplay.addEventListener('change', function() { syncFestivalDate(this.value); });

    function validateTimes() {
        const openFrom = openFromSelect.value;
        const openUntil = openUntilSelect.value;
        if (!openFrom || !openUntil) { timeError.style.display = 'none'; return true; }
        if (openUntil > openFrom) { timeError.style.display = 'none'; return true; }
        timeError.style.display = '';
        return false;
    }

    function validateDuplicate() {
        const date = festivalDateInput.value;
        if (date && existingDates.has(date)) {
            duplicateError.style.display = '';
            return false;
        }
        duplicateError.style.display = 'none';
        return true;
    }

    openFromSelect.addEventListener('change', validateTimes);
    openUntilSelect.addEventListener('change', validateTimes);

    form.addEventListener('submit', function(e) {
        if (!festivalDateInput.value) {
            festivalDateDisplay.setCustomValidity('Angiv en dato i formatet dd/mm/åååå.');
            festivalDateDisplay.reportValidity();
            e.preventDefault();
            return;
        }
        festivalDateDisplay.setCustomValidity('');
        const timesOk = validateTimes();
        const dupOk = validateDuplicate();
        if (!timesOk || !dupOk) {
            e.preventDefault();
        }
    });
})();
/*]]>*/
</script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    flatpickr('#festivalDateDisplay', {
        locale: 'da',
        dateFormat: 'd/m/Y',
        allowInput: true,
        onChange: function(selectedDates, dateStr) {
            if (window.syncFestivalDate) window.syncFestivalDate(dateStr || '');
        }
    });
});
</script>
</body>
</html>
