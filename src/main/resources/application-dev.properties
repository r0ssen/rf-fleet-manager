# Dev profile — uses H2 in-memory database (no PostgreSQL needed)
spring.datasource.url=jdbc:h2:mem:transport;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

 # Dev safety net: create/update tables if Flyway did not initialize this in-memory DB instance
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 web console — open http://localhost:8080/h2-console in browser
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Flyway still runs the migration SQL, but H2 needs a couple of tweaks
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration-h2

app.festival-year=2026
